<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Authorizing...</title>
  <style>
    body { margin:0; background:#0b0c10; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; color:#fff; flex-direction:column; gap:16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size:16px; font-weight:600; }
  </style>
</head>
<body>
  <svg viewBox="0 0 24 24" width="56" height="56" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.101 18.08.112 18.1.131 18.114a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
  <svg style="animation:spin 1s linear infinite" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5865F2" stroke-width="3"><circle cx="12" cy="12" r="10" stroke-opacity="0.2"/><path d="M4 12a8 8 0 018-8"/></svg>
  <p id="status">Authorizing with Discord...</p>
  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get("access_token");
    if (!token) {
      document.getElementById("status").textContent = "No token. Close and try again.";
    } else {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "DISCORD_TOKEN", token: token }, "*");
        document.getElementById("status").textContent = "Authorized! Closing...";
        setTimeout(() => window.close(), 800);
      } else {
        fetch("https://discord.com/api/users/@me", { headers: { Authorization: "Bearer " + token } })
        .then(r => r.json())
        .then(user => {
          localStorage.setItem("discord_user", JSON.stringify({
            id: user.id,
            username: user.global_name || user.username,
            email: user.email || null,
            avatar: user.avatar ? "https://cdn.discordapp.com/avatars/"+user.id+"/"+user.avatar+".png" : null
          }));
          document.getElementById("status").textContent = "Authorized! You can close this window.";
        });
      }
    }
  </script>
</body>
</html>
